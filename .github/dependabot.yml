version: 2
updates:
  - package-ecosystem: uv
    directory: /backend
    schedule: { interval: monthly }
    groups: { uv: { patterns: ["*"] } }
    # Pinned to @playwright/test in frontend/pnpm-lock.yaml, which the npm block moves: the toolchain
    # image ships only that release's browsers. Bump this one by hand with it.
    ignore:
      - dependency-name: playwright
  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: monthly }
    groups: { npm: { patterns: ["*"] } }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
    groups: { github-actions: { patterns: ["*"] } }
  - package-ecosystem: terraform
    directories: [/infra/stacks/*]
    schedule: { interval: monthly }
    groups: { terraform: { patterns: ["*"] } }
  - package-ecosystem: docker
    directory: /docker
    schedule: { interval: monthly }
    groups: { docker: { patterns: ["*"] } }
