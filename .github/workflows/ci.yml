name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a cold run builds the toolchain image
    steps:
      - uses: actions/checkout@v7
      - run: make check # in the toolchain container, like every make command

  # The local-build suite runs as parallel shards. Each uploads its own HTML report, with traces of
  # failed tests, even when tests fail.
  e2e-shard:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v7
      - run: make e2e
        env:
          E2E_SHARD: ${{ matrix.shard }}/${{ strategy.job-total }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: frontend/playwright-report/
          if-no-files-found: ignore

  # The one check branch protection requires: it fails unless every shard passed.
  e2e:
    needs: e2e-shard
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    steps:
      - run: test "$RESULT" = success
        env:
          RESULT: ${{ needs.e2e-shard.result }}
