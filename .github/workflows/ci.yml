name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20 # a cold run builds the toolchain image
    steps:
      - uses: actions/checkout@v7
      - run: make check # in the toolchain container, like every make command

  e2e:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # `make screenshots` checks out the base branch
      - run: make e2e
      - id: ui
        run: |
          if git diff --quiet "$BASE...HEAD" -- frontend/; then echo changed=false; else echo changed=true; fi >>"$GITHUB_OUTPUT"
        env:
          BASE: origin/${{ github.base_ref || 'main' }}
      - if: steps.ui.outputs.changed == 'true'
        run: make screenshots BASE=origin/${{ github.base_ref || 'main' }}
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-and-screenshots
          path: |
            frontend/playwright-report/
            .screenshots/
          include-hidden-files: true
          if-no-files-found: ignore
