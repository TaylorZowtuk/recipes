# Only gitleaks runs here, from the toolchain image (pinned in docker/Dockerfile), so the host needs
# no gitleaks. Formatting and linting live in `make fix` / `make check` and CI.
repos:
  - repo: local
    hooks:
      - id: gitleaks
        name: gitleaks
        language: unsupported
        entry: scripts/gitleaks.sh
        pass_filenames: false
