<title>Enrichment Review Prototype</title>
<!--
  PROTOTYPE, throwaway. Answers "Prototype: enrichment review screen" (TaylorZowtuk/recipes#30):
  how an editor checks a recipe's enrichment on a phone, how items are confirmed in bulk,
  and how Needs Review is reached from the tab bar. Three variants, switchable with #A / #B / #C
  (the artifact viewer drops query strings, so the hash stands in for ?variant=).
    A "Checklist":   banner on Recipes -> list by recipe -> one long sectioned checklist.
    B "One at a time": badge on the account button -> list grouped by kind -> a triage card per item.
    C "In the recipe": Needs Review chip on Recipes -> the recipe view itself in review mode.
  Shared rule in every variant: bulk confirm never includes an item with an open Enrichment Issue.
  Hosted inside "Prototype: whole-app flow" variant A (tab bar) with the "Plateful" tokens.
  All state is in memory; the editor is always signed in. Recipes and sites are invented.
-->

<script>
const VARIANTS = { A: "Checklist", B: "One at a time", C: "In the recipe" };
const HIGH = 0.8; // confidence threshold for bulk confirm (B) and weight conversion

const ic = {
  back: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  user: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>',
  check: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  flag: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 21V4h11l-2 4 2 4H5"/></svg>',
  chev: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  timer: '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>',
  search: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>',
  recipes: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/></svg>',
  week: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',

  sites: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg>',
};

// ---------- data ----------
function seed() {
  const recipes = [
    { id: "r1", title: "Lemon chicken traybake", site: "Sheet Pan Supper", status: "Awaiting Review", channel: "Add a recipe", total: "55 min" },
    { id: "r2", title: "Weeknight red lentil dal", site: "Dal Days", status: "Ready", channel: "Bulk import", total: "35 min" },
    { id: "r3", title: "Shawarma blend", site: "Spice blends (sheet)", status: "Ready", channel: "Bulk import", total: "" },
    { id: "r4", title: "Miso-glazed salmon", site: "Tidewater Kitchen", status: "Ready", channel: "Bulk import", total: "25 min", done: true, d: [1, 2, 1] },
    { id: "r5", title: "Brown butter cookies", site: "Crumb Club", status: "Ready", channel: "Bulk import", total: "1 hr 10 min", done: true, d: [2, 2, 2] },
    { id: "r6", title: "Tomato galette", site: "Sheet Pan Supper", status: "Pending", channel: "Add a recipe", total: "1 hr 30 min", done: true },
  ];
  const L = (id, r, conf, o) => ({ id, r, kind: "line", conf, ok: false, prov: "parser", ...o });
  const items = [

let S;
function fresh() {
  S = { ...seed(), v: "A", stack: [{ s: "home" }], sheet: null, toast: null, cFilter: false, cTab: "ing", oneByOne: false, hist: [] };
}
fresh();

// ---------- queries ----------
const R = id => S.recipes.find(r => r.id === id);
const I = id => S.items.find(i => i.id === id);
const issueOf = it => S.issues.find(x => x.item === it.id && x.open);
const itemsOf = rid => S.items.filter(i => i.r === rid);
const unchecked = rid => itemsOf(rid).filter(i => !i.ok);
const openIssues = rid => S.issues.filter(x => x.open && I(x.item).r === rid);
const reviewRecipes = () => S.recipes.filter(r => unchecked(r.id).length).sort((a, b) =>
  (a.status === "Awaiting Review" ? 0 : 1) - (b.status === "Awaiting Review" ? 0 : 1) || openIssues(b.id).length - openIssues(a.id).length);
const allOpenIssues = () => S.issues.filter(x => x.open);
const isNewCanon = it => it.kind === "line" && S.canon[it.canon] && !S.canon[it.canon].ok;
const bulkable = list => list.filter(i => !i.ok && !issueOf(i));
const cur = () => S.stack[S.stack.length - 1];

// ---------- mutations ----------
function snap() { S.hist.push(JSON.stringify({ recipes: S.recipes, items: S.items, issues: S.issues, canon: S.canon })); }
function undo() { const h = S.hist.pop(); if (!h) return; Object.assign(S, JSON.parse(h)); S.toast = { msg: "Undone" }; render(); }
function confirmIds(ids, msg) {
  if (!ids.length) return;
  snap();
  ids.forEach(id => {
    const it = I(id); it.ok = true;
    S.issues.forEach(x => { if (x.item === id) x.open = false; });
    if (it.kind === "line" && S.canon[it.canon]) S.canon[it.canon].ok = true;
  });
  S.toast = { msg: msg || (ids.length === 1 ? "Confirmed" : `Confirmed ${ids.length} items`), undo: true };
  settle();
}
function settle() {
  S.recipes.forEach(r => {
    if (r.status === "Awaiting Review" && !unchecked(r.id).length) {
      r.status = "Ready";
      S.toast = { msg: `${r.title} is Ready. It now joins the grocery list and fridge matching.`, undo: true };
    }
  });
  render();
}
function go(s) { S.stack.push(s); S.sheet = null; render(); window.scrollTo(0, 0); }
function back() { if (S.stack.length > 1) S.stack.pop(); S.sheet = null; render(); window.scrollTo(0, 0); }
function home() { S.stack = [{ s: "home" }]; S.sheet = null; render(); }

// ---------- item rendering (shared) ----------
const pct = c => Math.round(c * 100) + "%";
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
function meters(d) {
  const m = (lab, n) => `<span class="meter" title="${lab} ${n} of 3">${lab} ${[1, 2, 3].map(k => `<i class="${k <= n ? "on" : ""}"></i>`).join("")}</span>`;
  return `<span class="meters">${m("Prep", d[0])}${m("Cook", d[1])}${m("Cleanup", d[2])}<b class="tnum">${d[0] + d[1] + d[2]}</b></span>`;
}
function kindName(it) { return { line: "Ingredient line", step: "Step " + (it.n || ""), sub: "Substitution", diff: "Difficulty" }[it.kind]; }
function headline(it) {
  if (it.kind === "line") return esc(it.orig);
  if (it.kind === "step") return esc(it.text);
  if (it.kind === "sub") return `${esc(it.from)} → ${esc(it.to)}`;
  return "Suggested Difficulty";
}
function amount(it) { return [it.q, it.u].filter(Boolean).join(" "); }
function convText(it) {
  const c = it.conv;
  if (it.ratio) return `<span class="muted">Ratio, so no weight until a batch size is chosen</span>`;
  if (!c) return `<span class="muted">No amount, so no conversion</span>`;
  if (c.below) return `Stays in ${esc(it.u)}s <span class="muted">(≈ ${c.g} at ${pct(c.conf)}, under ${pct(HIGH)})</span>`;
  return `${c.est ? "≈ " : ""}${c.g} <span class="prov">${c.prov}</span>`;
}
function detail(it) {
  if (it.kind === "line") {
    const nc = isNewCanon(it);
    return `<dl class="kv">
      <dt>Parsed</dt><dd>${esc(amount(it) || "no amount")} · <b>${esc(it.name)}</b>${it.prep ? ` · ${esc(it.prep)}` : ""} <span class="prov">${it.prov}</span></dd>
      <dt>Ingredient</dt><dd><span class="canon">${esc(it.canon)}</span> ${nc ? `<span class="pill red">new</span>` : ""}${it.staple ? ` <span class="pill line">pantry staple</span>` : ""}<br><span class="muted small">${esc(it.cat)}${S.canon[it.canon] ? " · family " + S.canon[it.canon].fam : ""}</span></dd>
      <dt>Weight</dt><dd>${convText(it)}</dd>
    </dl>${nc ? `<p class="small muted" style="margin:0">Confirming adds <b>${esc(it.canon)}</b> to the household's ingredients, for every recipe that uses it.</p>` : ""}`;
  }
  if (it.kind === "step") {
    return `<div class="stack" style="gap:8px">
      ${it.links.length ? `<div class="linkchips">${it.links.map(([n, p]) => `<span class="linkchip">${esc(n)} <em>${p}</em></span>`).join("")}</div>` : `<span class="small muted">No ingredients linked</span>`}
      ${it.timer ? `<span class="timerchip">${ic.timer} Timer ${it.timer}${it.timer.includes("–") ? " (chime, then alarm)" : ""}</span>` : ""}
    </div>`;
  }
  if (it.kind === "sub") {
    return `<dl class="kv"><dt>Ratio</dt><dd><b class="tnum">≈ ${esc(it.ratio)}</b> <span class="prov">llm</span></dd>${it.note ? `<dt>Note</dt><dd>${esc(it.note)}</dd>` : ""}</dl>
      <p class="small muted" style="margin:0">Hidden from the recipe until confirmed.</p>`;
  }
  return `<div class="stack" style="gap:6px">${meters(it.d)}<span class="small muted">${esc(it.why)} <span class="prov">${it.prov}</span></span></div>`;
}
function issueBox(it) {
  const x = issueOf(it);
  if (!x) return "";
  return `<div class="issuebox"><div class="row" style="gap:6px">${ic.flag}<b>${esc(x.title)}</b></div>
    <div><s>${esc(x.before)}</s> → <b>${esc(x.after)}</b></div><div>${esc(x.why)}</div></div>`;
}
function tickBtn(it) {
  return `<button class="tick ${it.ok ? "on" : ""}" data-act="confirm" data-id="${it.id}" ${it.ok ? "disabled" : ""} aria-label="${it.ok ? "Confirmed" : "Confirm"}"><span>${ic.check}</span></button>`;
}
function statusPill(r) {
  if (r.status === "Awaiting Review") return `<span class="pill warn">Awaiting Review</span>`;
  if (r.status === "Pending") return `<span class="pill warn">Enrichment pending</span>`;
  return `<span class="pill soft">Ready</span>`;
}
function progress(rid) {
  const all = itemsOf(rid), done = all.filter(i => i.ok).length;
  return { done, all: all.length, w: all.length ? (done / all.length) * 100 : 100 };
}

// ---------- shell ----------
function topbar(title, pushed, extra = "") {
  const badge = S.v === "B" && allOpenIssues().length ? `<span class="badge">${allOpenIssues().length}</span>` : "";
  return `<header class="top ${pushed ? "pushed" : ""}">
    ${pushed ? `<button class="iconbtn" data-act="back" aria-label="Back">${ic.back}</button>` : ""}
    <h1>${title}</h1>${extra}
    <button class="iconbtn" data-act="account" aria-label="Account">${ic.user}${badge}</button>
  </header>`;
}
function tabbar() {
  const dot = S.v === "C" && reviewRecipes().length ? `<span class="dot"></span>` : "";
  const t = (k, lab, i, d = "") => `<button class="tab ${k === "recipes" ? "on" : ""}" data-act="${k === "recipes" ? "home" : "stub"}" data-lab="${lab}">${i}${d}${lab}</button>`;
  return `<nav class="tabbar">${t("recipes", "Recipes", ic.recipes, dot)}${t("week", "Week", ic.week)}${t("fridge", "Fridge", ic.fridge)}${t("sites", "Sites", ic.sites)}</nav>`;
}
function rcard(r, extra = "") {
  const d = r.done ? r.d : (itemsOf(r.id).find(i => i.kind === "diff") || {}).d;
  return `<button class="card rcard" data-act="open" data-id="${r.id}">
    <div class="plate">${r.title[0]}</div><h3>${esc(r.title)}</h3>
    <span class="small muted">${esc(r.site)}${r.total ? " · " + r.total : ""}</span>
    ${d && r.status !== "Pending" ? meters(d) : ""}${extra}
  </button>`;
}

// ---------- variant A: checklist ----------
function A_home() {
  const rr = reviewRecipes(), n = allOpenIssues().length;
  return topbar("Recipes") + `<main class="content">
    <div class="search">${ic.search} Search recipes</div>
    ${rr.length ? `<button class="banner" data-act="go" data-s="list">
      <span class="grow"><b>Needs Review</b><span class="small">${rr.length} recipe${rr.length > 1 ? "s" : ""} · ${n} issue${n === 1 ? "" : "s"} to check</span></span>${ic.chev}</button>` : ""}
    <div class="grid">${S.recipes.map(r => rcard(r, r.status !== "Ready" ? statusPill(r) : "")).join("")}</div>
  </main>`;
}
function A_list() {
  const rr = reviewRecipes();
  return topbar("Needs Review", true) + `<main class="content">
    <p class="small muted" style="margin:0">Awaiting Review recipes are left out of the grocery list and fridge matching until checked. Ready recipes work now and use safe defaults until checked.</p>
    ${rr.length ? `<div class="card">${rr.map((r, k) => `${k ? '<div class="divider"></div>' : ""}<button class="rrow" data-act="go" data-s="review" data-id="${r.id}">
      <div class="plate">${r.title[0]}</div>
      <span class="grow"><b>${esc(r.title)}</b><br>${statusPill(r)} <span class="small muted">${openIssues(r.id).length} issues · ${unchecked(r.id).length} to check</span></span>${ic.chev}</button>`).join("")}</div>`
      : `<div class="empty">Nothing needs review.</div>`}
  </main>`;
}
function A_review(rid) {
  const r = R(rid), p = progress(rid), its = itemsOf(rid);
  const flagged = its.filter(i => issueOf(i));
  const sec = (key, title, list) => {
    if (!list.length) return "";
    const b = bulkable(list);
    return `<section class="card sec">
      <div class="sechead"><h2>${title}</h2>${b.length ? `<button class="btn soft small" data-act="bulk" data-ids="${b.map(i => i.id).join(",")}">Confirm ${b.length}</button>` : `<span class="pill soft">${ic.check} Done</span>`}</div>
      ${list.map(it => A_item(it)).join("")}
    </section>`;
  };
  return topbar(esc(r.title), true) + `<main class="content">
    <div class="sticky-sum">
      <div class="row">${statusPill(r)}<span class="small muted grow">${r.channel}</span><b class="small tnum">${p.done} of ${p.all} checked</b></div>
      <div class="progress"><i style="width:${p.w}%"></i></div>
    </div>
    ${flagged.length ? `<section class="card sec"><div class="sechead"><h2>Issues</h2><span class="pill red">${flagged.length}</span></div>
      <p class="small muted" style="margin:0;padding:0 14px 8px">Check these one by one. “Confirm” buttons below skip them.</p>
      ${flagged.map(it => A_item(it, true)).join("")}</section>` : ""}
    ${sec("line", "Ingredients", its.filter(i => i.kind === "line"))}
    ${sec("step", "Steps", its.filter(i => i.kind === "step"))}
    ${sec("sub", "Substitutions", its.filter(i => i.kind === "sub"))}
    ${sec("diff", "Difficulty", its.filter(i => i.kind === "diff"))}
  </main>`;
}
function A_item(it, inIssues) {
  const x = issueOf(it);
  if (x && !inIssues) return `<div class="aitem"><span class="tick"><span style="box-shadow:inset 0 0 0 2.25px var(--red);color:var(--red)">${ic.flag}</span></span>
    <div class="body"><span>${headline(it)}</span><span class="small" style="color:var(--red-text);font-weight:700">In Issues above</span></div></div>`;
  return `<div class="aitem ${x ? "flag" : ""}">${tickBtn(it)}
    <div class="body">
      ${it.kind === "diff" ? "" : `<span style="font-weight:${it.kind === "line" ? 700 : 400}">${headline(it)}</span>`}
      ${x ? issueBox(it) : ""}
      ${detail(it)}
      <div class="acts">${x ? `<button class="btn primary small" data-act="confirm" data-id="${it.id}">Accept</button>` : ""}
        <button class="btn ghost small" data-act="edit" data-id="${it.id}">Edit</button></div>
    </div></div>`;
}

// ---------- variant B: one at a time ----------
const KINDS = [
  ["issues", "Enrichment Issues", "Corrections and doubts to check one by one", l => l.filter(i => issueOf(i))],
  ["newcanon", "New ingredients", "Proposed canonical ingredients", l => l.filter(i => !issueOf(i) && isNewCanon(i))],
  ["line", "Ingredient lines", "Parse, ingredient and weight", l => l.filter(i => !issueOf(i) && !isNewCanon(i) && i.kind === "line")],
  ["step", "Steps", "Linked ingredients, portions, timers", l => l.filter(i => !issueOf(i) && i.kind === "step")],
  ["sub", "Substitutions", "Ratios proposed by enrichment", l => l.filter(i => !issueOf(i) && i.kind === "sub")],
  ["diff", "Difficulty", "Suggested Prep, Cook, Cleanup", l => l.filter(i => !issueOf(i) && i.kind === "diff")],
];
function B_home() {
  return topbar("Recipes") + `<main class="content">
    <div class="search">${ic.search} Search recipes</div>
    <div class="chips"><span class="chip">weeknight</span><span class="chip">one pan</span><span class="chip">baking</span><span class="chip">spice blend</span></div>
    <div class="grid">${S.recipes.map(r => rcard(r, r.status !== "Ready" ? statusPill(r) : "")).join("")}</div>
  </main>`;
}
function B_list() {
  const open = S.items.filter(i => !i.ok && R(i.r).status !== "Pending");
  const rr = reviewRecipes();
  return topbar("Needs Review", true) + `<main class="content">
    <div><div class="eyebrow" style="padding:0 4px 6px">By kind, across recipes</div>
    <div class="card">${KINDS.map(([k, t, sub, f]) => { const n = f(open).length; return `<button class="kindrow" data-act="queue" data-kind="${k}" ${n ? "" : "disabled"} style="${n ? "" : "opacity:.5"}">
      <span class="n tnum" style="${k === "issues" && n ? "color:var(--red-text)" : ""}">${n}</span><span class="grow"><b>${t}</b><br><span class="small muted">${sub}</span></span>${n ? ic.chev : ic.check}</button>`; }).join("")}</div></div>
    <div><div class="eyebrow" style="padding:0 4px 6px">By recipe</div>
    <div class="card">${rr.map(r => `<button class="kindrow" data-act="queue" data-rid="${r.id}">
      <span class="grow"><b>${esc(r.title)}</b><br>${statusPill(r)} <span class="small muted">${unchecked(r.id).length} to check</span></span>${ic.chev}</button>`).join("") || `<div class="empty">Nothing needs review.</div>`}</div></div>
  </main>`;
}
function buildQueue(kind, rid) {
  let l = S.items.filter(i => !i.ok && R(i.r).status !== "Pending");
  if (rid) l = l.filter(i => i.r === rid);
  if (kind) l = KINDS.find(k => k[0] === kind)[3](l);
  const rank = i => (issueOf(i) ? 0 : i.conf < HIGH ? 1 : 2);
  return l.sort((a, b) => rank(a) - rank(b) || S.items.indexOf(a) - S.items.indexOf(b)).map(i => i.id);
}
function B_triage(c) {
  const title = c.rid ? esc(R(c.rid).title) : KINDS.find(k => k[0] === c.kind)[1];
  const left = c.q.filter(id => !I(id).ok && !c.skipped.includes(id));
  const total = c.q.length, done = c.q.filter(id => I(id).ok).length;
  const head = `<div class="stack" style="gap:6px"><div class="row"><span class="small muted grow">${c.rid ? statusPill(R(c.rid)) + " " + R(c.rid).channel : "Across all recipes"}</span><b class="small tnum">${done} of ${total}</b></div>
    <div class="progress"><i style="width:${total ? done / total * 100 : 100}%"></i></div></div>`;
  let body;
  const easy = left.filter(id => !issueOf(I(id)) && I(id).conf >= HIGH);
  if (!left.length) {
    const sk = c.q.filter(id => !I(id).ok);
    body = `<div class="card tcard" style="align-items:center;justify-content:center;text-align:center">
      <div class="plate" style="width:120px;font-size:40px;color:var(--accent-text)">${ic.check}</div>
      <h2>${sk.length ? `${sk.length} skipped` : "All checked"}</h2>
      <p class="muted" style="margin:0">${sk.length ? "Skipped items stay in Needs Review." : "Nothing left in this list."}</p>
      <div class="row" style="justify-content:center">${sk.length ? `<button class="btn soft" data-act="unskip">Go through skipped</button>` : ""}<button class="btn primary" data-act="back">Back to Needs Review</button></div></div>`;
  } else if (!c.oneByOne && easy.length === left.length && left.length >= 3) {
    const kinds = {}; easy.forEach(id => { const k = kindName(I(id)).replace(/ \d+$/, "") + "s"; kinds[k] = (kinds[k] || 0) + 1; });
    body = `<div class="card tcard">
      <div class="eyebrow">The rest</div>
      <h2 style="font-size:23px">${easy.length} items left, all ${pct(HIGH)} confidence or higher, no issues</h2>
      <div class="linkchips">${Object.entries(kinds).map(([k, n]) => `<span class="linkchip">${n} ${k.toLowerCase()}</span>`).join("")}</div>
      <p class="small muted" style="margin:0">Flagged and low-confidence items were shown one by one first.</p>
      <div class="grow"></div>
      <div class="tacts"><button class="btn primary" data-act="bulk" data-ids="${easy.join(",")}">Confirm all ${easy.length}</button>
        <button class="btn soft" data-act="onebyone" style="grid-column:1/-1">Check them one by one</button></div></div>`;
  } else {
    const it = I(left[0]), x = issueOf(it);
    body = `<div class="card tcard">
      <div class="row"><span class="eyebrow grow">${kindName(it)}${c.rid ? "" : " · " + esc(R(it.r).title)}</span><span class="prov">confidence ${pct(it.conf)}</span></div>
      <div class="orig">${it.kind === "diff" ? "Suggested Difficulty" : headline(it)}</div>
      ${x ? issueBox(it) : ""}
      ${detail(it)}
      <div class="grow"></div>
      <div class="tacts"><button class="btn primary" data-act="confirm" data-id="${it.id}">${x ? "Accept correction" : "Confirm"}</button>
        <button class="btn soft" data-act="edit" data-id="${it.id}">Edit</button><button class="btn soft" data-act="skip" data-id="${it.id}">Skip</button></div></div>
      <p class="small muted" style="margin:0;text-align:center">${left.length - 1} more after this</p>`;
  }
  return topbar(title, true) + `<main class="content">${head}${body}</main>`;
}

// ---------- variant C: in the recipe ----------
function C_home() {
  const rr = reviewRecipes(), f = S.cFilter;
  const list = f ? rr : S.recipes;
  return topbar("Recipes") + `<main class="content">
    <div class="search">${ic.search} Search recipes</div>
    <div class="chips">${rr.length ? `<button class="chip review ${f ? "on" : ""}" data-act="cfilter">${ic.flag} Needs Review · ${rr.length}</button>` : ""}
      <span class="chip">weeknight</span><span class="chip">one pan</span><span class="chip">spice blend</span></div>
    ${f ? `<p class="small muted" style="margin:0">Awaiting Review first, then the most issues.</p>` : ""}
    <div class="grid">${list.map(r => {
      const n = unchecked(r.id).length, x = openIssues(r.id).length;
      const tag = r.status === "Awaiting Review" ? statusPill(r) : r.status === "Pending" ? statusPill(r) : n && f ? `<span class="pill soft">Ready</span>` : "";
      return rcard(r, tag + (n && r.status !== "Pending" ? `<span class="pill ${x ? "red" : "line"}">${x ? x + " flagged · " : ""}${n} to check</span>` : ""));
    }).join("")}</div>
  </main>`;
}
function C_line(it) {
  const x = issueOf(it), cls = it.ok ? "ok" : x ? "flag" : "pending";
  const amt = it.conv && !it.conv.below && !it.ratio ? `${esc(amount(it))} <span class="muted small">(${it.conv.est ? "≈ " : ""}${it.conv.g})</span>` : esc(amount(it));
  return `<button class="cline ${cls}" data-act="sheet" data-id="${it.id}"><span class="txt"><b>${amt}</b> ${esc(it.name.replace("; ", " and "))}${it.prep ? `, <span class="muted">${esc(it.prep)}</span>` : ""}
    ${isNewCanon(it) ? ` <span class="pill red">new</span>` : ""}</span>
    <span class="mark">${it.ok ? ic.check : x ? ic.flag : ""}</span></button>`;
}
function C_review(rid) {
  const r = R(rid), its = itemsOf(rid), tab = S.cTab;
  const byTab = { ing: its.filter(i => i.kind === "line" || i.kind === "sub"), steps: its.filter(i => i.kind === "step"), about: its.filter(i => i.kind === "diff") };
  const cnt = k => byTab[k].filter(i => !i.ok).length;
  const seg = [["ing", "Ingredients"], ["steps", "Steps"], ["about", "About"]].map(([k, l]) => `<button class="${tab === k ? "on" : ""}" data-act="ctab" data-tab="${k}">${l}${cnt(k) ? `<span class="cnt">${cnt(k)}</span>` : ""}</button>`).join("");
  const flagged = openIssues(rid).length;
  let body = "";
  if (tab === "ing") {
    const lines = its.filter(i => i.kind === "line"), subs = its.filter(i => i.kind === "sub");
    body = `<div class="card" style="padding:6px">${lines.map(C_line).join("")}</div>
      ${subs.length ? `<div><div class="eyebrow" style="padding:0 4px 6px">Substitutions · hidden until confirmed</div><div class="card" style="padding:6px">${subs.map(s => {
        const cls = s.ok ? "ok" : "pending";
        return `<button class="cline ${cls}" data-act="sheet" data-id="${s.id}"><span class="txt">${esc(s.to)} <span class="muted">for ${esc(s.from)}, ≈ ${s.ratio}</span></span><span class="mark">${s.ok ? ic.check : ""}</span></button>`;
      }).join("")}</div></div>` : ""}`;
  } else if (tab === "steps") {
    const st = byTab.steps;
    body = st.length ? `<div class="card" style="padding:6px">${st.map(s => `<button class="cstep" data-act="sheet" data-id="${s.id}">
      <span class="num">${s.n}</span><span class="stack" style="gap:6px"><span>${esc(s.text)}</span>${detail(s)}</span>
      <span class="cline ${s.ok ? "ok" : "pending"}" style="padding:0;min-height:0;background:none"><span class="mark">${s.ok ? ic.check : ""}</span></span></button>`).join("")}</div>` : `<div class="empty">This recipe has no steps.</div>`;
  } else {
    const d = byTab.about[0];
    body = `<div class="card pad stack">
      ${d ? `<button class="cline ${d.ok ? "ok" : "pending"}" data-act="sheet" data-id="${d.id}" style="padding:4px 0"><span class="txt" style="text-decoration:none"><span class="eyebrow">Difficulty ${d.ok ? "" : "· suggested"}</span><br>${meters(d.d)}</span><span class="mark">${d.ok ? ic.check : ""}</span></button>` : ""}
      <div class="divider"></div>
      <dl class="kv"><dt>Source</dt><dd>${esc(r.site)}</dd><dt>Stated total</dt><dd>${r.total || "Not given"}</dd><dt>Added by</dt><dd>${r.channel}</dd></dl></div>`;
  }
  const tabItems = byTab[tab], b = bulkable(tabItems), left = unchecked(rid).length, p = progress(rid);
  const bar = `<div class="reviewbar">
    <div class="row"><span class="small grow">${left ? `<b>${left} to check</b> <span class="muted">· ${flagged} flagged</span>` : "<b>All checked</b>"}</span>${statusPill(r)}</div>
    <div class="progress"><i style="width:${p.w}%"></i></div>
    ${b.length ? `<button class="btn primary" data-act="bulk" data-ids="${b.map(i => i.id).join(",")}">Confirm ${b.length} on this tab${tabItems.some(i => issueOf(i)) ? " (not flagged)" : ""}</button>`
      : `<button class="btn soft" disabled>${tabItems.some(i => !i.ok) ? "Only flagged items left here. Tap one." : "This tab is checked"}</button>`}
  </div>`;
  return topbar("", true) + `<main class="content">
    <div class="hero"><div class="plate">${r.title[0]}</div><h1>${esc(r.title)}</h1><span class="small muted">${esc(r.site)}</span></div>
    ${flagged ? `<div class="issuebox" style="flex-direction:row;align-items:center;gap:8px">${ic.flag}<span><b>${flagged} flagged by enrichment.</b> Tap a flagged item to check it.</span></div>` : ""}
    <div class="seg">${seg}</div>${body}</main>` + bar;
}

// ---------- sheets ----------
function sheetHTML() {
  const sh = S.sheet;
  if (!sh) return "";
  let inner = "";
  if (sh.t === "account") {
    const n = allOpenIssues().length;
    inner = `<div class="menu">
      ${S.v === "B" ? `<button data-act="go" data-s="list">${ic.flag}<span class="grow">Needs Review</span>${n ? `<span class="pill red">${n} issues</span>` : ""}</button>` : ""}
      <button data-act="stub" data-lab="Add a recipe">＋<span class="grow">Add a recipe</span></button>
      <button data-act="stub" data-lab="Kitchen settings">⚙<span class="grow">Kitchen settings</span></button>
      <button data-act="stub" data-lab="Sign out">↩<span class="grow">Sign out</span></button></div>`;
  } else if (sh.t === "item") {
    const it = I(sh.id), x = issueOf(it);
    inner = `<div class="row"><span class="eyebrow grow">${kindName(it)}</span><span class="prov">confidence ${pct(it.conf)}</span></div>
      <h2>${it.kind === "diff" ? "Suggested Difficulty" : headline(it)}</h2>
      ${x ? issueBox(it) : ""}${detail(it)}
      ${it.ok ? `<span class="pill soft" style="align-self:flex-start">${ic.check} Confirmed</span><button class="btn soft" data-act="edit" data-id="${it.id}">Edit</button>` :
        `<div class="stack" style="gap:8px"><button class="btn primary" data-act="confirm" data-id="${it.id}">${x ? "Accept correction" : "Confirm"}</button><button class="btn soft" data-act="edit" data-id="${it.id}">Edit</button></div>`}`;
  } else if (sh.t === "edit") {
    const it = I(sh.id);
    let f = "";
    if (it.kind === "line") f = `<div class="fields">
      <label class="field">Amount<input id="e-q" value="${esc(it.q)}"></label><label class="field">Unit<input id="e-u" value="${esc(it.u)}"></label>
      <label class="field wide">Ingredient as written<input id="e-name" value="${esc(it.name)}"></label>
      <label class="field wide">Preparation<input id="e-prep" value="${esc(it.prep)}"></label>
      <label class="field wide">Canonical ingredient<input id="e-canon" list="canons" value="${esc(it.canon)}"></label>
      ${it.conv && !it.ratio ? `<label class="field wide">Weight<select id="e-conv"><option value="keep" ${it.conv.below ? "selected" : ""}>Keep in ${esc(it.u || "count")}</option><option value="conv" ${it.conv.below ? "" : "selected"}>Convert to ${it.conv.est ? "≈ " : ""}${it.conv.g}</option></select></label>` : ""}
      <datalist id="canons"><option value="green olive"><option value="castelvetrano olive"><option value="chickpea"><option value="potato"><option value="salt"><option value="black pepper"></datalist></div>
      <p class="small muted" style="margin:0">A canonical ingredient change applies to every recipe with the same wording.</p>`;
    else if (it.kind === "step") f = `<div class="fields">${it.links.map(([n, p], k) => `<label class="field">${esc(n)}<input id="e-p${k}" value="${esc(p)}"></label>`).join("")}
      <label class="field wide">Timer<input id="e-timer" value="${esc(it.timer)}" placeholder="none"></label></div>
      <p class="small muted" style="margin:0">Portions of one ingredient add up to at most all of it.</p>`;
    else if (it.kind === "sub") f = `<div class="fields"><label class="field wide">Ratio (${esc(it.to)} : ${esc(it.from)})<input id="e-ratio" value="${esc(it.ratio)}"></label>
      <label class="field wide">Note<input id="e-note" value="${esc(it.note)}"></label></div>
      <button class="btn ghost" data-act="dropsub" data-id="${it.id}">Remove this substitution</button>`;
    else f = ["Prep", "Cook", "Cleanup"].map((lab, k) => `<div class="row"><span class="grow"><b>${lab}</b></span><div class="segpick">${[1, 2, 3].map(n => `<button class="${sh.d[k] === n ? "on" : ""}" data-act="dpick" data-k="${k}" data-n="${n}">${n}</button>`).join("")}</div></div>`).join("");
    inner = `<div class="eyebrow">Edit ${kindName(it).toLowerCase()}</div><h2>${it.kind === "diff" ? "Difficulty" : headline(it)}</h2>${f}
      <p class="small muted" style="margin:0">Saving marks it Confirmed, with provenance “editor”.</p>
      <div class="row"><button class="btn soft grow" data-act="close">Cancel</button><button class="btn primary grow" data-act="save" data-id="${it.id}">Save and confirm</button></div>`;
  } else if (sh.t === "stub") {
    inner = `<h2>${esc(sh.lab)}</h2><p class="muted" style="margin:0">Not part of this prototype. See “Prototype: whole-app flow”.</p><button class="btn soft" data-act="close">Close</button>`;
  }
  return `<div class="scrim" data-act="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${inner}</div></div>`;
}
function saveEdit(id) {
  const it = I(id), v = k => (document.getElementById(k) || {}).value;
  snap();
  if (it.kind === "line") {
    Object.assign(it, { q: v("e-q"), u: v("e-u"), name: v("e-name"), prep: v("e-prep") });
    const c = v("e-canon").trim();
    if (c !== it.canon) { it.canon = c; if (!S.canon[c] && c === "green olive") it.cat = "Canned & Jarred"; }
    if (it.conv && v("e-conv")) it.conv.below = v("e-conv") === "keep";
  } else if (it.kind === "step") {
    it.links = it.links.map(([n], k) => [n, v("e-p" + k)]); it.timer = v("e-timer");
  } else if (it.kind === "sub") { it.ratio = v("e-ratio"); it.note = v("e-note"); }
  else it.d = S.sheet.d.slice();
  it.prov = "editor"; it.ok = true; it.conf = 1;
  S.issues.forEach(x => { if (x.item === id) x.open = false; });
  if (it.kind === "line" && S.canon[it.canon]) S.canon[it.canon].ok = true;
  S.sheet = null; S.toast = { msg: "Saved and confirmed", undo: true };
  settle();
}

// ---------- render ----------
function screen() {
  const c = cur(), v = S.v;
  if (c.s === "home") return v === "A" ? A_home() : v === "B" ? B_home() : C_home();
  if (c.s === "list") return v === "B" ? B_list() : A_list();
  if (c.s === "review") return v === "A" ? A_review(c.id) : v === "C" ? C_review(c.id) : B_triage(c);
  if (c.s === "triage") return B_triage(c);
  return "";
}
function render() {
  const c = cur();
  const app = document.getElementById("app");
  const bar = S.v === "C" && c.s === "review";
  app.className = "app" + (bar ? " has-bar" : "");
  document.body.classList.toggle("has-bar", bar);
  app.innerHTML = screen() + tabbar();
  const t = S.toast;
  document.getElementById("overlay").innerHTML = sheetHTML() + (t ? `<div class="toast" role="status"><span class="grow">${esc(t.msg)}</span>${t.undo ? `<button data-act="undo">Undo</button>` : ""}</div>` : "");
  document.getElementById("vlabel").textContent = `${S.v} · ${VARIANTS[S.v]}`;
  clearTimeout(render.tt);
  if (t) render.tt = setTimeout(() => { S.toast = null; const el = document.querySelector(".toast"); if (el) el.remove(); }, 4500);
}

function openRecipe(id) {
  const r = R(id);
  if (r.status === "Pending" || !unchecked(id).length) { S.sheet = { t: "stub", lab: r.title }; render(); return; }
  if (S.v === "B") go({ s: "triage", rid: id, q: buildQueue(null, id), skipped: [] });
  else { S.cTab = "ing"; go({ s: "review", id }); }
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (a === "scrim") { if (e.target === el) { S.sheet = null; render(); } return; }
  e.stopPropagation();
  switch (a) {
    case "back": back(); break;
    case "home": home(); break;
    case "account": S.sheet = { t: "account" }; render(); break;
    case "stub": S.sheet = { t: "stub", lab: el.dataset.lab }; render(); break;
    case "close": S.sheet = null; render(); break;
    case "go": el.dataset.s === "review" ? openRecipe(id) : go({ s: el.dataset.s, id }); break;
    case "open": openRecipe(id); break;
    case "confirm": S.sheet = null; confirmIds([id]); break;
    case "bulk": confirmIds(el.dataset.ids.split(",")); break;
    case "undo": undo(); break;
    case "edit": { const it = I(id); S.sheet = { t: "edit", id, d: it.d ? it.d.slice() : null }; render(); break; }
    case "save": saveEdit(id); break;
    case "dpick": S.sheet.d[+el.dataset.k] = +el.dataset.n; render(); break;
    case "dropsub": snap(); S.items = S.items.filter(i => i.id !== id); S.sheet = null; S.toast = { msg: "Substitution removed", undo: true }; settle(); break;
    case "sheet": S.sheet = { t: "item", id }; render(); break;
    case "queue": { const k = el.dataset.kind, rid = el.dataset.rid; S.oneByOne = false; go({ s: "triage", kind: k, rid, q: buildQueue(k, rid), skipped: [] }); break; }
    case "skip": cur().skipped.push(id); render(); break;
    case "unskip": cur().skipped = []; render(); break;
    case "onebyone": cur().oneByOne = true; render(); break;
    case "cfilter": S.cFilter = !S.cFilter; render(); break;
    case "ctab": S.cTab = el.dataset.tab; render(); break;
  }
});

function setVariant(v) {
  S.v = v; S.stack = [{ s: "home" }]; S.sheet = null; S.cFilter = false;
  if (location.hash !== "#" + v) history.replaceState(null, "", "#" + v);
  render(); window.scrollTo(0, 0);
}
const keys = Object.keys(VARIANTS);
const step = d => setVariant(keys[(keys.indexOf(S.v) + d + keys.length) % keys.length]);
document.getElementById("prev").onclick = () => step(-1);
document.getElementById("next").onclick = () => step(1);
document.getElementById("reset").onclick = () => { const v = S.v; fresh(); setVariant(v); };
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "ArrowLeft") step(-1);
  if (e.key === "ArrowRight") step(1);
  if (e.key === "Escape" && S.sheet) { S.sheet = null; render(); }
});
window.addEventListener("hashchange", () => { const h = location.hash.slice(1); if (VARIANTS[h] && h !== S.v) setVariant(h); });
setVariant(VARIANTS[location.hash.slice(1)] ? location.hash.slice(1) : "A");
</script>
