];
const SITES = [
  { name: "Serious Eats", url: "https://www.seriouseats.com", note: "Technique-heavy. The Kenji recipes never fail." },
  { name: "Budget Bytes", url: "https://www.budgetbytes.com", note: "Cheap weeknight dinners, good cost breakdowns." },
  { name: "Hot Thai Kitchen", url: "https://hot-thai-kitchen.com", note: "Pailin's Thai recipes; watch the videos for the tricky ones." },
  { name: "Sally's Baking Addiction", url: "https://sallysbakingaddiction.com", note: "Reliable baking, weights given." },
  { name: "BBC Good Food", url: "https://www.bbcgoodfood.com", note: "Metric; good for stews and roasts." },
];
const VARIANTS = { A: "Tab bar", B: "Search-first", C: "Kitchen dashboard" };

// ---------------- state ----------------
const S = {
  variant: (location.hash.slice(1) in VARIANTS) ? location.hash.slice(1) : "A",
  role: "visitor",
  stack: [{ s: "home" }],
  q: "", tags: [], maxDiff: 9, maxTime: 0, easyCleanup: false,
  week: [1, 5], checked: {}, fridge: ["chicken thigh", "rice", "green onion"],
  pick: false, sheet: null, menu: false, drawer: false, preview: 1, sitesEdit: false,
  ingest: { stage: "url", url: "", steps: [], draft: null },
  showState: false, toast: "",
};
const cur = () => S.stack[S.stack.length - 1];
const isEditor = () => S.role === "editor";
const byId = id => RECIPES.find(r => r.id === id);
const allTags = () => [...new Set(RECIPES.flatMap(r => r.tags))].sort();
const totalD = r => r.d[0] + r.d[1] + r.d[2];
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const fmtT = m => m == null ? "—" : m < 60 ? `${m} min` : `${Math.floor(m / 60)} h${m % 60 ? " " + (m % 60) : ""}`;
const initials = t => t.split(/\s+/).filter(w => /^[A-Z]/.test(w)).slice(0, 2).map(w => w[0]).join("");
const fmtQ = q => { const w = Math.floor(q), f = +(q - w).toFixed(2); const fr = { 0.25: "¼", 0.5: "½", 0.75: "¾" }[f] || (f ? f.toString().slice(1) : ""); return (w ? w : "") + fr || "0"; };

function filtered() {
  const q = S.q.trim().toLowerCase();
  return RECIPES.filter(r => {
    if (q && !(r.title + " " + r.tags.join(" ") + " " + r.site + " " + r.ing.map(i => i.c).join(" ")).toLowerCase().includes(q)) return false;
    if (S.tags.some(t => !r.tags.includes(t))) return false;
    if (totalD(r) > S.maxDiff) return false;
    if (S.easyCleanup && r.d[2] > 1) return false;
    if (S.maxTime && (r.t.total == null || r.t.total > S.maxTime)) return false;
    return true;
  }).sort((a, b) => b.added - a.added);
}
const filterCount = () => S.tags.length + (S.maxDiff < 9) + (S.maxTime > 0) + S.easyCleanup;

function grocery() {
  const map = new Map(); const hidden = new Set();
  S.week.map(byId).filter(r => r && !r.pending).forEach(r => r.ing.forEach(i => {
    if (STAPLES.includes(i.c)) { hidden.add(i.c); return; }
    const k = i.c + "|" + i.u;
    const e = map.get(k) || { ...i, q: 0, from: [] };
    e.q += i.q; e.from.push(r.title); map.set(k, e);
  }));
  const groups = CATS.map(c => ({ cat: c, items: [...map.values()].filter(i => i.cat === c).sort((a, b) => a.c.localeCompare(b.c)) })).filter(g => g.items.length);
  return { groups, hidden: [...hidden], count: map.size };
}
function fridgeMatches() {
  const have = new Set(S.fridge);
  return RECIPES.filter(r => !r.pending).map(r => {
    const need = [...new Set(r.ing.map(i => i.c).filter(c => !STAPLES.includes(c)))];
    const hit = need.filter(c => have.has(c)), miss = need.filter(c => !have.has(c));
    return { r, hit, miss };
  }).filter(m => m.hit.length).sort((a, b) => a.miss.length - b.miss.length || b.hit.length - a.hit.length);
}
const ALL_ING = [...new Set(RECIPES.flatMap(r => r.ing.map(i => i.c)))].filter(c => !STAPLES.includes(c)).sort();

const thumb = (r, cls = "", st = "") => `<div class="thumb ${cls}" style="--h:${r.h};${st}" aria-hidden="true">${initials(r.title)}</div>`;
const meter = n => `<span class="m">${[1, 2, 3].map(i => `<i class="${i <= n ? "f" : ""}"></i>`).join("")}</span>`;
const diff = r => `<span class="diff" title="Prep ${r.d[0]} · Cook ${r.d[1]} · Cleanup ${r.d[2]}">${meter(r.d[0])}${meter(r.d[1])}${meter(r.d[2])}<b>${totalD(r)}</b></span>`;

  siteMove: d => { const i = +d.i, j = i + +d.v; [SITES[i], SITES[j]] = [SITES[j], SITES[i]]; },
  ingestFrom: d => { S.ingest = { stage: "url", url: d.v.replace(/\/?$/, "/"), steps: [], draft: null }; go("ingest"); },
  ingestTry: d => { S.ingest.url = d.v; startIngest(d.v); },
  ingestReset: () => { S.ingest = { stage: "url", url: "", steps: [], draft: null }; },
  ddiff: d => { const x = S.ingest.draft.d; x[+d.i] = Math.min(3, Math.max(1, x[+d.i] + +d.v)); },
  dtag: d => { const t = S.ingest.draft.tags; S.ingest.draft.tags = t.includes(d.v) ? t.filter(x => x !== d.v) : [...t, d.v]; },
  ingestSave: () => {
    const d = S.ingest.draft, host = S.ingest.url.replace(/^https?:\/\/(www\.)?/, "").split("/")[0];
    const r = { id: nextId++, title: d.title, site: SITES.find(s => s.url.includes(host))?.name || host, host, h: Math.floor(Math.random() * 360), tags: d.tags, d: d.d, t: d.t, added: 100 + nextId, pending: true, ing: [] };
    RECIPES.push(r); S.ingest = { stage: "url", url: "", steps: [], draft: null };
    S.stack = [{ s: "home" }, { s: "recipe", id: r.id }];
    setTimeout(() => { r.pending = false; r.ing = [I("onion", 1, "", "Produce"), I("canned tomato", 1, "can", "Canned & jarred"), I("parmesan", 0.25, "cup", "Dairy & eggs")]; render(); }, 6000);
  },
};

function startIngest(url) {
  if (!url) return;
  const g = S.ingest; g.url = url;
  const dupe = RECIPES.find(r => url.includes(r.host) && /gochujang/.test(url) && r.id === 1);
  if (dupe) { g.stage = "dupe"; g.dupe = dupe.id; render(); return; }
  const tricky = /tricky/.test(url), fail = /fail/.test(url);
  const plan = [["Check robots.txt", "ok"], ["Fetch page", "ok"]];
  if (tricky || fail) plan.push(["Read recipe markup", "bad"], ["Load page in a browser", "ok"], ["Read recipe markup again", "bad"], ["Ask the LLM to extract it", fail ? "bad" : "ok"]);
  else plan.push(["Read recipe markup", "ok"]);
  if (!fail) plan.push(["Save image", "ok"]);
  g.stage = "working"; g.steps = []; render();
  let i = 0;
  const tick = () => {
    if (g.steps.length) g.steps[g.steps.length - 1].st = plan[i - 1][1];
    if (i < plan.length) { g.steps.push({ label: plan[i][0], st: "run" }); i++; render(); setTimeout(tick, 450); return; }
    if (fail) { g.stage = "failed"; render(); return; }
    const slug = url.split("/").filter(Boolean).pop().replace(/^(tricky|fail)-/, "");
    g.draft = { title: slug.split("-").map(w => w[0].toUpperCase() + w.slice(1)).join(" "), via: tricky ? "llm" : "markup", t: { prep: 10, cook: 25, total: tricky ? null : 35 }, lines: ["1 lb potato gnocchi", "1 pint cherry tomatoes", "1 red onion, sliced", "2 tbsp olive oil", "½ cup grated parmesan", "Salt and pepper"], steps: 5, d: [1, 1, 1], tags: [] };
    g.stage = "review"; render();
  };
  tick();
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el) return;
  if (el.classList.contains("sheet-bg") && e.target.closest("[data-stop]")) return;
  const f = ACT[el.dataset.act]; if (!f) return;
  e.preventDefault(); f(el.dataset); render();
});
document.addEventListener("input", e => {
  const k = e.target.dataset.in; if (!k) return;
  if (k === "q") S.q = e.target.value;
  if (k === "maxDiff") { S.maxDiff = +e.target.value; document.querySelectorAll("#f-diff-v").forEach(x => x.textContent = S.maxDiff); return; }
  if (k === "draftTitle") { S.ingest.draft.title = e.target.value; return; }
  render();
});
document.addEventListener("change", e => { if (e.target.dataset.in === "maxDiff") render(); });
document.addEventListener("submit", e => {
  e.preventDefault();
  const f = e.target, kind = f.dataset.form, fd = new FormData(f);
  if (kind === "fridge") { const v = f.querySelector("input").value.trim().toLowerCase(); if (v && !S.fridge.includes(v)) S.fridge.push(v); }
  if (kind === "newtag") { const v = f.querySelector("input").value.trim().toLowerCase(); const r = byId(+f.dataset.id); if (v && !r.tags.includes(v)) r.tags.push(v); }
  if (kind === "ingest") { const v = f.querySelector("input").value.trim(); if (v) { if (cur().s !== "ingest") go("ingest"); startIngest(v); return; } }
  if (kind === "paste") { const g = S.ingest; g.steps.push({ label: "Read pasted page with the LLM", st: "ok" }); g.draft = { title: "Lasagna", via: "llm", t: { prep: 30, cook: 60, total: 90 }, lines: ["12 lasagna noodles", "1 lb ground beef", "24 oz marinara", "15 oz ricotta", "2 cups mozzarella"], steps: 8, d: [2, 2, 3], tags: [] }; g.stage = "review"; }
  if (kind === "site") { Object.assign(SITES[+f.dataset.i], { name: fd.get("name"), url: fd.get("url"), note: fd.get("note") }); }
  if (kind === "siteAdd") { if (fd.get("name")) SITES.push({ name: fd.get("name"), url: fd.get("url") || "https://", note: fd.get("note") || "" }); }
  render();
});
document.addEventListener("keydown", e => {
  if (e.target.closest("input, textarea, [contenteditable]")) return;
  if (e.key === "ArrowLeft" || e.key === "ArrowRight") { ACT.variant({ v: e.key === "ArrowLeft" ? -1 : 1 }); render(); }
});
addEventListener("hashchange", () => { const v = location.hash.slice(1); if (v in VARIANTS && v !== S.variant) { S.variant = v; S.stack = [{ s: "home" }]; render(); } });
let lastDesk = matchMedia("(min-width: 900px)").matches;
addEventListener("resize", () => { const d = matchMedia("(min-width: 900px)").matches; if (d !== lastDesk) { lastDesk = d; render(); } });
render();
</script>
