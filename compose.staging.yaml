# `make dev STAGING_PROFILE=<staging dev profile>` adds this: the API serves staging's table and
# images (recipes.staging) in place of the seeded fake, reading that profile from ~/.aws, mounted
# read-only. The profile must use static keys, since SSO would need to write its cache.
services:
  api:
    environment:
      API_APP: recipes.staging:app
      AWS_PROFILE: ${STAGING_PROFILE:?}
      AWS_CONFIG_FILE: /work/aws/config
      AWS_SHARED_CREDENTIALS_FILE: /work/aws/credentials
      # Staging's resources, named as infra/modules/stack-access names them. make sets the account ID.
      TABLE_NAME: plateful-staging
      IMAGES_BUCKET: plateful-staging-images-${STAGING_ACCOUNT_ID:?set STAGING_ACCOUNT_ID or run scripts/aws-setup.sh}
      SSM_PREFIX: /plateful/staging/
    volumes:
      - type: bind
        source: ${HOME}/.aws
        target: /work/aws
        read_only: true
        bind:
          create_host_path: false
